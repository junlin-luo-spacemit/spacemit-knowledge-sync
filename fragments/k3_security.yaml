    canonical_en: AES128/192/256, SHA1/224/256, RSA1024/2048/4096, ECC128/256/512, SM2/SM3/SM4
    canonical_zh: AES, SHA, RSA, ECC, SM2/SM3/SM4
    used_in:
      - docs-chip/en/key_stone/k3/k3_docs/k3_ds.md
