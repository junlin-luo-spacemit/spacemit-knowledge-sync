# K1 Connectivity Fragment Registry
# USB, PCIe, Ethernet, wireless interfaces

chip: K1
subsystem: connectivity

fragments:
  usb3_host:
    canonical_en: 1x USB 3.0
    canonical_zh: 1x USB 3.0
    note: Combo with PCIe 2.1 x1
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md

  usb2_interfaces:
    canonical_en: 2x USB 2.0
    canonical_zh: 2x USB 2.0
    note: OTG + Host
