# K1 Content Fragment Registry
# Canonical chip specs and every downstream file that reuses them.
# used_in: file paths only, no line numbers (lines shift too often).

chip: K1
family: Key Stone

fragments:
  processor_name:
    canonical: SpacemiT K1
    note: NOT SpacemiT M1 - M1 was a product codename that leaked into product docs.
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md
      - docs-chip/zh/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/zh/key_stone/k1/k1_docs/root_overview.md
      - docs-product/en/k1_muse_paper/root_overview.md
      - docs-product/zh/k1_muse_paper/root_overview.md

  core_count:
    canonical_en: 8-core
    canonical_zh: 8-core
    note: Dual-cluster 4+4 architecture. zh uses "8" in prose.
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/zh/key_stone/k1/k1_docs/k1_ds.md
      - docs-product/en/k1_muse_pi/root_overview.md
      - docs-product/en/k1_muse_book/root_overview.md
      - docs-product/en/k1_muse_box/root_overview.md
      - docs-product/en/k1_muse_card/root_overview.md
      - docs-product/en/k1_muse_paper/root_overview.md
      - docs-product/en/k1_muse_shelf/root_overview.md
      - docs-product/zh/k1_muse_pi/root_overview.md
      - docs-product/zh/k1_muse_book/root_overview.md
      - docs-product/zh/k1_muse_box/root_overview.md
      - docs-product/zh/k1_muse_card/root_overview.md
      - docs-product/zh/k1_muse_paper/root_overview.md
      - docs-product/zh/k1_muse_shelf/root_overview.md

  ai_compute:
    canonical_en: 2.0 TOPS
    canonical_zh: 2.0 TOPS
    note: Always include the .0. Forbidden - 2 TOPS, 2T, 2.0Tops
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md
      - docs-chip/zh/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/zh/key_stone/k1/k1_docs/root_overview.md
      - docs-product/en/k1_muse_pi/root_overview.md
