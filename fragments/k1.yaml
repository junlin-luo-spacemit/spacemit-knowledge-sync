      - docs-product/en/k1_muse_card/root_overview.md
      - docs-product/en/k1_muse_paper/root_overview.md
      - docs-product/en/k1_muse_shelf/root_overview.md
      - docs-product/en/k1_muse_pi_pro/root_overview.md
      - docs-product/en/k1_riscv_labkit/root_overview.md
      - docs-product/zh/k1_muse_pi/root_overview.md
      - docs-product/zh/k1_muse_book/root_overview.md
      - docs-product/zh/k1_muse_box/root_overview.md
      - docs-product/zh/k1_muse_card/root_overview.md
      - docs-product/zh/k1_muse_paper/root_overview.md
      - docs-product/zh/k1_muse_shelf/root_overview.md
      - docs-product/zh/k1_muse_pi_pro/root_overview.md
      - docs-product/zh/k1_riscv_labkit/root_overview.md

  cpu_performance:
    canonical_en: 50 KDMIPS
    canonical_zh: 50 KDMIPS
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md
      - docs-chip/zh/key_stone/k1/k1_docs/root_overview.md

  memory_type:
    canonical_en: LPDDR4/LPDDR4X
    canonical_zh: LPDDR4/LPDDR4X
    note: 32-bit interface, 2666 Mbps, up to 16 GB
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/zh/key_stone/k1/k1_docs/k1_ds.md

  l2_cache:
    canonical_en: 1MB
    canonical_zh: 1MB
    note: 1MB shared across 8 cores (512K per cluster)
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md
      - docs-chip/zh/key_stone/k1/k1_docs/k1_ds.md
      - docs-chip/zh/key_stone/k1/k1_docs/root_overview.md

  tdp:
    canonical_en: 3
    canonical_zh: 3
    note: Range 3-5 W. Used as lower-bound search token.
    used_in:
      - docs-chip/en/key_stone/k1/k1_docs/root_overview.md
      - docs-chip/zh/key_stone/k1/k1_docs/root_overview.md
