      - docs-product/en/k3_pico/root_overview.md
      - docs-product/zh/k3_pico/root_overview.md

  x100_pipeline:
    canonical_en: quad-issue out-of-order
    canonical_zh: quad-issue
    used_in:
      - docs-chip/en/key_stone/k3/k3_docs/k3_ds.md
      - docs-chip/en/key_stone/k3/k3_docs/root_overview.md

  a100_data_formats:
    canonical_en: BF16, FP16, FP8, INT8, INT4
    canonical_zh: BF16, FP16
