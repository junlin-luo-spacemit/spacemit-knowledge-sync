  a100_pmp:
    canonical_en: 32 PMP entries
    canonical_zh: 32 PMP
    used_in:
      - docs-chip/en/key_stone/k3/k3_docs/k3_ds.md

  display_layers:
    canonical_en: up to 4 full-size layer composers
    canonical_zh: 4 layer
    note: Maximum 16 via up-down layer reuse
    used_in:
      - docs-chip/en/key_stone/k3/k3_docs/k3_ds.md
