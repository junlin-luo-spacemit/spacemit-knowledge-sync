# spacemit-knowledge-sync — configuration
#
# Scans doc repos for terminology and description drift.
# Paths are relative to this repo's root.

repos:
  docs-chip:
    path: ../docs-chip
    langs: [en, zh]
    # Paths intentionally published in one language only.
    # Matched against the path relative to en/ or zh/ root.
    en_only:
      - "key_stone/k1/k1_docs/k1_usermanual/**"
      - "key_stone/k3/k3_docs/k3_usermanual/**"
      - "key_stone/k1/k1_hw/**"
      - "key_stone/k3/k3_hw/**"
      - "key_stone/k1/k1_sw/**"
      - "key_stone/k3/k3_sw/**"
      - "power_stone/p1/p1_hw/**"
  docs-product:
    path: ../docs-product
    langs: [en, zh]

checks:
  descriptions: true
  terms: true
  bilingual: true

# Files skipped by every check. Glob-ish, matched against the path
# relative to the repo root.
exclude:
  - "**/index.md"
  - "**/.git/**"
  - "**/.venv/**"
  - "**/node_modules/**"
