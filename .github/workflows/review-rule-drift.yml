name: Review Rule Drift Check

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check canonical review rules
    runs-on: ubuntu-latest

    steps:
      - name: Check out canonical rules
        uses: actions/checkout@v4
        with:
          path: spacemit-knowledge-sync

      - name: Check out docs-chip review rules
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/spacemit-com/docs-chip.git consumers/docs-chip
          git -C consumers/docs-chip sparse-checkout set .github/doc-review-agent

      - name: Check out docs-product review rules
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/spacemit-com/docs-product.git consumers/docs-product
          git -C consumers/docs-product sparse-checkout set .github/doc-review-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spacemit-knowledge-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r spacemit-knowledge-sync/requirements.txt

      - name: Report rule drift
        working-directory: spacemit-knowledge-sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_CONSUMER_ROOT: ${{ github.workspace }}/consumers
        run: python scripts/report_rule_sync_drift.py
